<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Alysia Lewis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">

        <!-- Header -->
        <header>
            <img src="logo.png" alt="Photo of Alysia Lewis">
            <div class="header-text">
                <h1>Alysia Lewis</h1>
                <p>Cybersecurity Student | Security+ Certified</p>
            </div>
        </header>

        <!-- Navigation -->
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="resources.html">Resources</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main>
            <h2>Contact Me</h2>
            <p>
                Fill out the form below for any questions you have about me:
            </p>
        </main>
           

<!-- Form with id="webForm" and action="#" -->
<!-- Contact Form -->
<form id="webForm" action="#">
            
    <!-- Contact Information -->
    <fieldset>
        <legend>Contact Information</legend>

        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="fullName" required>

        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required>

        <label for="organization">Organization</label>
        <input type="text" id="organization" name="organization">

        <label for="inquiryTopic">Inquiry Topic</label>
        <input list="topics" id="inquiryTopic" name="inquiryTopic">

        <datalist id="topics">
            <option value="Credential Verification">
            <option value="Education Verification">
            <option value="Cybersecurity Career Advice">
            <option value="Professional Networking">
            <option value="Internship Opportunity">
            <option value="Employment Opportunity">
        </datalist>
    </fieldset>

    <!-- Visitor Type -->
    <fieldset>
        <legend>Visitor Type</legend>
 
        <label>
            <input type="radio" name="visitorType" value="student" checked>
            Student
        </label>

        <label>
            <input type="radio" name="visitorType" value="recruiter">
            Recruiter
        </label>

        <label>
            <input type="radio" name="visitorType" value="professional">
            IT Professional
        </label>

        <label>
            <input type="radio" name="visitorType" value="organization">
            Organization Representative
        </label>
    </fieldset>

    <!-- Preferred Contact Methods -->
    <fieldset>
        <legend>Preferred Contact Method</legend>

        <label>
            <input type="checkbox" name="contactMethod" value="email">
            Email
        </label>

        <label>
            <input type="checkbox" name="contactMethod" value="linkedin">
            LinkedIn
        </label>

        <label>
            <input type="checkbox" name="contactMethod" value="phone">
            Phone
        </label>
    </fieldset>

    <!-- Experience Level Menu -->
    <label for="experienceLevel">Experience Level</label>

    <select id="experienceLevel" name="experienceLevel">
        <option value="">Select Experience Level</option>
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
        <option value="expert">Expert</option>
    </select>

    <!-- Message Area -->
    <label for="message">Message *</label>
    <textarea id="message" name="message" rows="6" required></textarea>
    

        
    <!-- Form Buttons -->
    <button type="submit">Submit</button>
    <button type="reset">Clear Form</button>
</form>
        <div id="output"></div>
        <!-- Footer -->
        <footer>
            <p>&copy; 2026 Alysia Lewis</p>
        </footer>

    </div>
    <!-- end .page-wrapper -->
    <!-- Link to validation script -->
    <script src="form.js"></script>
</body>
</html>
