<!DOCTYPE html>
                <legend>Visitor Type</legend>
                <label>
                    <input type="radio" name="visitorType" value="student" checked>
                    Student
                </label>
                <label>
                    <input type="radio" name="visitorType" value="recruiter">
                    Recruiter
                </label>
                <label>
                    <input type="radio" name="visitorType" value="professional">
                    IT Professional
                </label>
                <label>
                    <input type="radio" name="visitorType" value="organization">
                    Organization Representative
                </label>
            </fieldset>

            <!-- Preferred Contact Methods -->
            <fieldset>
                <legend>Preferred Contact Method</legend>
                <label>
                    <input type="checkbox" name="contactMethod" value="email">
                    Email
                </label>
                <label>
                    <input type="checkbox" name="contactMethod" value="linkedin">
                    LinkedIn
                </label>
                <label>
                    <input type="checkbox" name="contactMethod" value="phone">
                    Phone
                </label>
            </fieldset>

            <!-- Experience Level -->
            <label for="experienceLevel">Experience Level</label>
            <select id="experienceLevel" name="experienceLevel">
                <option value="">Select Experience Level</option>
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
                <option value="expert">Expert</option>
            </select>

            <!-- Message Area -->
            <label for="message">Message *</label>
            <textarea id="message" name="message" rows="6" 
                      required minlength="10"></textarea>
            <span id="messageError" class="error"></span>

            <!-- Form Buttons -->
            <button type="submit">Submit</button>
            <button type="reset">Clear Form</button>

            <!-- Overall validation message -->
            <div id="formMessage" class="form-message"></div>
        </form>

        <div id="output"></div>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 Alysia Lewis</p>
        </footer>

    </div>

    <!-- Scripts (validation first, then original form.js) -->
    <script src="validation.js"></script>
    <script src="form.js"></script>
</body>
</html>
