<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Alysia Lewis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">

        <!-- Header -->
        <header>
            <img src="logo.png" alt="Photo of Alysia Lewis">
            <div class="header-text">
                <h1>Alysia Lewis</h1>
                <p>Cybersecurity Student | Security+ Certified</p>
            </div>
        </header>

        <!-- Navigation -->
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="resources.html">Resources</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main>
            <h2>Contact Me</h2>
            <p>
                Fill out the form below for any questions you have about me:
            </p>
            
            <!-- Form with id="webForm" and action="#" -->
            <form id="webForm" action="#">

                <!-- Personal Information Fieldset -->
                <fieldset>
                    <legend> Information</legend>

                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" required>
                    
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>

                    <label for="toolUsed">Need to verify my credentials?</label>
                    <input list="tools" id="toolUsed" name="toolUsed" placeholder="">
                    <datalist id="tools">
                        <option value="Credential Verification">
                        <option value="Education Verification">
                        <option value="General Inquiry">
                        <option value="Networking/Career Advice">
                        <option value="Speaking Engagement Inquiry">
                        <option value="Internship/Job Opportunity">
                    </datalist>
                </fieldset>

                <!-- Inquiry Type Fieldset -->
                <fieldset>
                    <legend>I am A...</legend>

                    <label>
                        <input type="radio" name="inquiryType" value="question" checked>
                        Student
                    </label>
                    <label>
                        <input type="radio" name="inquiryType" value="project">
                        Company
                    </label>
                    <label>
                        <input type="radio" name="inquiryType" value="mentorship">
                        Individual
                    </label>
                </fieldset>

                <!-- Contact Preferences Fieldset -->
                <fieldset>
                    <legend>Preferred Contact Method</legend>

                    <label>
                        <input type="checkbox" name="contactPref" value="email">
                        Email
                    </label>
                    <label>
                        <input type="checkbox" name="contactPref" value="linkedin">
                        LinkedIn
                    </label>
                    <label>
                        <input type="checkbox" name="contactPref" value="call">
                        Phone Call
                    </label>
                </fieldset>

                <!-- Experience Level Dropdown -->
                <label for="experienceLevel">Your Experience Level:</label>
                <select id="experienceLevel" name="experienceLevel">
                    <option value="" disabled selected>Select your level</option>
                    <option value="beginner">Beginner (Learning)</option>
                    <option value="intermediate">Intermediate (Certified)</option>
                    <option value="advanced">Advanced (Professional)</option>
                    <option value="expert">Expert (Researcher/Instructor)</option>
                </select>

                <!-- Message -->
                <label for="message">Message *</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <!-- Submit and Reset Buttons -->
                <button type="submit">Send Message</button>
                <button type="reset">Reset Form</button>
            </form>
        </main>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 Alysia Lewis</p>
        </footer>

    </div>
    <!-- end .page-wrapper -->
</body>
</html>
