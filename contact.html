<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Resources | Alysia Lewis</title>
    <!-- Link to shared CSS -->
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
    <div class="page-wrapper">

        <!-- Header -->
        <header>
            <img src="logo.png" alt="Photo of Alysia Lewis">
            <div class="header-text">
                <h1>Alysia Lewis</h1>
                <p>Cybersecurity Student | Security+ Certified</p>
            </div>
        </header>

        <!-- Navigation -->
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="resources.html">Resources</a></li>
            </ul>
        </nav>
    <div class="container">
        <header>
            <h1>Contact Form</h1>
            <p>Please fill out the form below to get in touch.</p>
        </header>

        <!-- Note the id="webForm" and novalidate attributes -->
        <form id="webForm" action="#" method="post" novalidate>
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" name="fullName" required minlength="2" maxlength="50" placeholder="Jane Doe">
            <span id="fullNameError" class="error"></span>

            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required placeholder="example@domain.com">
            <span id="emailError" class="error"></span>

            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="phone" required pattern="[1, 4, 6-12]{3}-[1, 4, 6-12]{3}-[1, 4, 6-12]{4}" placeholder="123-456-7890">
            <span id="phoneError" class="error"></span>

            <fieldset>
                <legend>Visitor Type</legend>
                <label>
                    <input type="radio" name="visitorType" value="student" checked> Student
                </label>
                <label>
                    <input type="radio" name="visitorType" value="recruiter"> Recruiter
                </label>
                <label>
                    <input type="radio" name="visitorType" value="professional"> IT Professional
                </label>
                <label>
                    <input type="radio" name="visitorType" value="organization"> Organization Representative
                </label>
            </fieldset>

            <fieldset>
                <legend>Preferred Contact Method</legend>
                <label>
                    <input type="checkbox" name="contactMethod" value="email"> Email
                </label>
                <label>
                    <input type="checkbox" name="contactMethod" value="linkedin"> LinkedIn
                </label>
                <label>
                    <input type="checkbox" name="contactMethod" value="phone"> Phone
                </label>
            </fieldset>

            <label for="experienceLevel">Experience Level</label>
            <select id="experienceLevel" name="experienceLevel">
                <option value="">Select Experience Level</option>
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
                <option value="expert">Expert</option>
            </select>

            <label for="message">Message *</label>
            <textarea id="message" name="message" rows="6" required minlength="10" placeholder="Enter your message here..."></textarea>
            <span id="messageError" class="error"></span>

            <button type="submit">Submit</button>
            <button type="reset">Clear Form</button>

            <!-- Overall status message container -->
            <div id="formMessage" class="form-message"></div>
        </form>

        <!-- Form Output area managed by form.js -->
        <div id="output"></div>

        <footer>
            <p>&copy; 2026 Alysia Lewis</p>
        </footer>

    </div>

    <!-- Script execution order is critical. validation.js must run and intercept before form.js processes -->
    <script src="validation.js"></script>
    <script src="form.js"></script>
</body>
</html>
